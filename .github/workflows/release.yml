name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2.9.3

      - name: Verify tag matches Cargo.toml
        shell: bash
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          package_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          if [[ -z "$package_version" || "$tag_version" != "$package_version" ]]; then
            echo "Tag version '$tag_version' does not match Cargo.toml version '$package_version'."
            exit 1
          fi

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features
      - name: Run tests
        run: cargo test --all-features
      - name: Package crate
        run: cargo package

      - name: Create checksum
        shell: bash
        run: |
          set -euo pipefail
          crate="$(find target/package -maxdepth 1 -name '*.crate' -print -quit)"
          test -n "$crate"
          sha256sum "$crate" > "$crate.sha256"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            target/package/*.crate
            target/package/*.crate.sha256

      - name: Publish to crates.io
        if: ${{ env.CARGO_REGISTRY_TOKEN != '' }}
        run: cargo publish --token "$CARGO_REGISTRY_TOKEN"
